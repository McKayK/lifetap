<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No viewport-fit=cover. Together with black-translucent below, it was
         added in f6de134 ("fixed landscape iphone bug") and is what asks iOS
         for a full-bleed viewport. The older pre-notch iPad mishandles that
         request: it subtracts the 20px status bar from the web view's HEIGHT
         but still positions the view at y=0, so 20px of screen at the BOTTOM
         ends up outside the web view entirely — an unpaintable black strip
         that no CSS can reach (window.innerHeight is 1004 while screen is
         1024). Leaving viewport-fit off keeps the classic behavior. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="HandheldFriendly" content="true" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black-fullscreen" is deliberately NOT a valid value (the real ones
         are default / black / black-translucent). iOS ignores it, and being
         ignored is the point: the manifest's "display": "fullscreen" below
         hides the status bar completely, so there is no status bar for this
         tag to style and nothing for the OS to reserve space for. This exact
         pairing shipped from April through Sept 4 with no bottom bar on the
         iPad. Do not "correct" this to black-translucent — that is what
         reintroduces the strip described above. "default" would be the
         honest spelling of the same no-op if you ever want to tidy it. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-fullscreen"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Required. Without this link iOS falls back to the plain meta-tag
         install path, which has no concept of display:fullscreen — so the
         status bar comes back and takes its 20px with it. The manifest was
         never the cause of the bottom bar; it sat unchanged at
         display:fullscreen through every failing build. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>MTG Lifetap Clone</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
