<!doctype html>
<html lang="en">
  <head>
    <!-- IMPORTANT: every meta tag below must stay byte-identical to
         index.html's. This page exists only to read real numbers off the
         installed app, and it can only do that if iOS gives it the SAME
         viewport the real app gets. It previously kept viewport-fit=cover
         and black-translucent after index.html moved off them, which made
         every measurement taken here describe a configuration the app no
         longer uses. If you change index.html's head, change it here too. -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="HandheldFriendly" content="true" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-fullscreen"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Its own manifest, not index.html's. A manifest link is required to
         get display:fullscreen on install, but iOS forces Add to Home Screen
         to the manifest's start_url — so pointing at /manifest.webmanifest
         would install the real app at "/" and lose this page entirely. This
         one declares start_url "/debug.html", so the icon lands here with an
         otherwise identical install. -->
    <link rel="manifest" href="/debug.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Lifetap Debug</title>
  </head>
  <body style="background: #0a0a0a; margin: 0">
    <div id="root"></div>
    <script>
      // Pull the real built app's <link rel="stylesheet"> and
      // <script type="module"> tags out of /index.html and load them here,
      // instead of hardcoding hashed filenames that change every build.
      fetch("/index.html")
        .then((res) => res.text())
        .then((html) => {
          const doc = new DOMParser().parseFromString(html, "text/html");
          doc.querySelectorAll('link[rel="stylesheet"]').forEach((link) => {
            const el = document.createElement("link");
            el.rel = "stylesheet";
            el.href = link.getAttribute("href");
            document.head.appendChild(el);
          });
          const script = doc.querySelector('script[type="module"]');
          if (script) {
            const el = document.createElement("script");
            el.type = "module";
            el.src = script.getAttribute("src");
            document.body.appendChild(el);
          } else {
            document.getElementById("root").textContent =
              "Couldn't find the app's script tag in /index.html.";
          }
        })
        .catch((err) => {
          document.getElementById("root").textContent =
            "Failed to load the app: " + err;
        });
    </script>
  </body>
</html>
